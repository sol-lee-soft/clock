<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Terminal">
    
    <link rel="manifest" href="data:application/json,{%22name%22:%22Desk%20Terminal%22,%22short_name%22:%22Terminal%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23000000%22,%22theme_color%22:%22%23000000%22}">
    
    <title>Desk Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000000; /* Pure black for edge-to-edge OLED matching */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f3f4f6;
            margin: 0;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #workspace {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Clean Interface Animation Classes */
        .zen-hidden {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.2s ease-in-out, visibility 0.2s;
        }
        .zen-active .zen-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* Massive Primary Chrono Layout Core */
        .time-display {
            display: flex;
            align-items: baseline;
            justify-content: center;
            font-weight: 200;
            letter-spacing: -4px;
            margin-bottom: 4px;
        }
        #time-digits {
            font-size: 8.5rem;
            color: #ffffff;
            line-height: 0.85;
        }
        #sec-digits {
            font-size: 1.8rem;
            color: #00ff66;
            font-family: monospace;
            margin-left: 6px;
            letter-spacing: 0;
        }

        /* Compact Uniform Atmospheric Grid Rows */
        .metrics-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 380px;
        }
        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid #111622;
        }
        .m-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .m-val {
            font-size: 1.25rem;
            font-weight: 400;
        }
        .m-val.highlight {
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }
        .m-val.accent {
            color: #00ff66;
            font-family: monospace;
        }

        /* Consolidated Single-Line Control Footer */
        .control-footer {
            text-align: center;
            font-size: 0.75rem;
            color: #4b5563;
            padding: 8px;
            font-family: monospace;
            letter-spacing: 0.5px;
            margin-top: 6px;
            width: 100%;
            border-top: 1px dashed #1f2937;
        }
        .action-link {
            color: #00ff66;
            cursor: pointer;
            margin-left: 8px;
            font-weight: bold;
            display: inline-block;
        }
        .action-link:hover {
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }
        .action-link.edit-btn {
            color: #9ca3af;
            margin-left: 12px;
        }
    </style>
</head>
<body onclick="toggleZenDisplay()">

<div id="workspace">
    
    <div class="time-display">
        <span id="time-digits">00:00</span><span id="sec-digits">00</span>
    </div>

    <div class="metrics-list">
        <div class="metric-item">
            <div class="m-label">Temperature</div>
            <div class="m-val highlight" id="data-temp">--°F</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Sky Condition</div>
            <div class="m-val" id="data-cond">Syncing...</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Humidity</div>
            <div class="m-val accent" id="data-humid">--%</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Barometer</div>
            <div class="m-val accent" id="data-baro">-- IN</div>
        </div>
    </div>

    <div class="control-footer zen-hidden" id="control-bar">
        <span id="status-string">STATION: HOME</span>
        <span id="toggle-action" class="action-link" onclick="toggleTrackingMode(event)">[SWITCH TO LOCAL]</span>
        <span id="edit-action" class="action-link edit-btn" onclick="editHomeZip(event)">[EDIT ZIP]</span>
    </div>
</div>

<script>
    let currentMode = localStorage.getItem('terminal_mode') || "home"; // Remembers last picked mode on reload
    let homeZip = localStorage.getItem('terminal_home_zip');
    let isZenActive = false;

    if (!homeZip) {
        homeZip = "94505";
        localStorage.setItem('terminal_home_zip', homeZip);
    }

    // Clear Workspace Toggle: Masks the control line completely out of view when background is clicked
    function toggleZenDisplay() {
        isZenActive = !isZenActive;
        const workspace = document.getElementById("workspace");
        if (isZenActive) {
            workspace.classList.add("zen-active");
        } else {
            workspace.classList.remove("zen-active");
        }
    }

    function tick() {
        const now = new Date();
        let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
        
        h = h % 12; h = h ? h : 12;
        m = m < 10 ? '0' + m : m; s = s < 10 ? '0' + s : s;

        document.getElementById("time-digits").innerText = `${h}:${m}`;
        document.getElementById("sec-digits").innerText = s;

        if (m === 0 && s === 0) {
            updateAtmosphereFeed();
        }
    }

    // Handles switching between Home and Local GPS tracking within the single bottom line
    function toggleTrackingMode(event) {
        if (event) event.stopPropagation(); // Prevent background click from firing zen mask
        
        currentMode = (currentMode === "home") ? "local" : "home";
        localStorage.setItem('terminal_mode', currentMode);
        
        renderControlBar();
        updateAtmosphereFeed();
    }

    // Renders the correct text options onto the unified single-line footer row
    function renderControlBar() {
        const statusStr = document.getElementById("status-string");
        const toggleBtn = document.getElementById("toggle-action");
        const editBtn = document.getElementById("edit-action");

        if (currentMode === "home") {
            statusStr.innerText = "STATION: HOME";
            toggleBtn.innerText = "[SWITCH TO LOCAL]";
            editBtn.style.display = "inline-block";
        } else {
            statusStr.innerText = "STATION: LOCAL";
            toggleBtn.innerText = "[SWITCH TO HOME]";
            editBtn.style.display = "none"; // Hide edit link when relying on live raw GPS coordinates
        }
    }

    function editHomeZip(event) {
        if (event) event.stopPropagation(); // Block layout structure click bubbling
        const res = prompt("Enter 5-Digit HOME Base ZIP Code:", homeZip);
        if (res && res.length === 5 && !isNaN(res)) {
            homeZip = res;
            localStorage.setItem('terminal_home_zip', homeZip);
            if (currentMode === "home") updateAtmosphereFeed();
        }
    }

    function updateAtmosphereFeed() {
        if (currentMode === "home") {
            fetchHomeWeather();
        } else {
            fetchGpsLocalWeather();
        }
    }

    async function fetchHomeWeather() {
        try {
            document.getElementById("data-cond").innerText = "Syncing Home...";
            const geoRes = await fetch(`https://api.zippopotam.us/us/${homeZip}`);
            if (!geoRes.ok) throw new Error();
            const geoData = await geoRes.json();
            
            const lat = geoData.places[0].latitude;
            const lon = geoData.places[0].longitude;
            
            fetchRadarMetrics(lat, lon);
        } catch {
            document.getElementById("data-cond").innerText = "Location Error";
        }
    }

    function fetchGpsLocalWeather() {
        if (!navigator.geolocation) {
            document.getElementById("data-cond").innerText = "No GPS Capability";
            return;
        }

        document.getElementById("data-cond").innerText = "Searching Satellites...";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                fetchRadarMetrics(position.coords.latitude, position.coords.longitude);
            },
            () => {
                document.getElementById("data-cond").innerText = "GPS Banned";
            },
            { enableHighAccuracy: false, timeout: 6000, maximumAge: 120000 }
        );
    }

    async function fetchRadarMetrics(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,weather_code&temperature_unit=fahrenheit`;
            const response = await fetch(url);
            const data = await response.json();
            const current = data.current;

            const wmoCodes = {
                0: "Clear Sky ☀️", 1: "Mainly Clear 🌤️", 2: "Partly Cloudy ⛅", 3: "Overcast ☁️",
                45: "Foggy 🌫️", 51: "Light Drizzle 🌧️", 61: "Slight Rain 🌧️", 63: "Moderate Rain 🌧️",
                65: "Heavy Rain 🌧️", 71: "Slight Snow ❄️", 80: "Rain Showers 🌦️", 95: "Thunderstorm 🌩️"
            };

            const hpaToInches = (current.surface_pressure * 0.02953).toFixed(2);
            document.getElementById("data-temp").innerText = `${Math.round(current.temperature_2m)}°F`;
            document.getElementById("data-cond").innerText = wmoCodes[current.weather_code] || "Clear Sky ☀️";
            document.getElementById("data-humid").innerText = `${current.relative_humidity_2m}%`;
            document.getElementById("data-baro").innerText = `${hpaToInches} IN`;

        } catch (err) {
            document.getElementById("data-cond").innerText = "Server Timeout";
        }
    }

    setInterval(tick, 1000);
    tick();
    renderControlBar();
    updateAtmosphereFeed();
</script>

</body>
</html>
