<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Desk Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000000; /* Pure black backdrop for crisp OLED contrast */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f3f4f6;
            margin: 0;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #workspace {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Station Segment Selector Headers */
        .station-selector {
            display: flex;
            justify-content: center;
            gap: 24px;
            border-bottom: 1px dashed #1f2937;
            padding-bottom: 8px;
            margin-bottom: 4px;
        }
        .station-btn {
            font-family: monospace;
            font-size: 0.85rem;
            color: #4b5563;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1.5px;
            transition: all 0.2s;
        }
        .station-btn.active {
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        /* Massive Primary Chrono Core Display */
        .time-display {
            display: flex;
            align-items: baseline;
            justify-content: center;
            font-weight: 200;
            letter-spacing: -3px;
        }
        #time-digits {
            font-size: calc(5.5rem + 2vw);
            color: #ffffff;
            line-height: 0.95;
        }
        #sec-digits {
            font-size: 1.5rem;
            color: #00ff66;
            font-family: monospace;
            margin-left: 4px;
            letter-spacing: 0;
        }

        /* Highly Compacted Atmospheric Rows */
        .metrics-list {
            display: flex;
            flex-direction: column;
            gap: 6px; /* Tight grid convergence */
        }
        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0; /* Minimal vertical footprint padding */
            border-bottom: 1px solid #111622;
        }
        .m-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .m-val {
            font-size: 1.2rem;
            font-weight: 400;
        }
        .m-val.highlight {
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }
        .m-val.accent {
            color: #00ff66;
            font-family: monospace;
        }

        /* Hide-and-Seek Setup Footer Segment */
        .config-trigger {
            text-align: center;
            font-size: 0.72rem;
            color: #374151;
            cursor: pointer;
            padding: 6px;
            font-family: monospace;
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease-in-out;
            opacity: 1;
            margin-top: 4px;
        }
        .config-trigger.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Landscape Orientation Dynamic Layout Reflow Matrix */
        @media (orientation: landscape) {
            body {
                padding: 8px;
            }
            #workspace {
                max-width: 680px;
                display: grid;
                grid-template-columns: 1.1fr 1fr;
                column-gap: 32px;
                row-gap: 4px;
                align-items: center;
            }
            .station-selector {
                grid-column: span 2;
                padding-bottom: 6px;
                margin-bottom: 0;
            }
            .time-display {
                justify-content: center;
                margin-bottom: 0;
            }
            #time-digits {
                font-size: calc(6rem + 1vw);
            }
            .metrics-list {
                gap: 4px;
            }
            .config-trigger {
                grid-column: span 2;
                margin-top: 0;
                padding: 2px;
            }
        }
    </style>
</head>

    </div>
    
    <div class="time-display">

</div>
