<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Desk Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000000; /* Pure black backdrop for crisp OLED contrast */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f3f4f6;
            margin: 0;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #workspace {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Station Segment Selector Headers */
        .station-selector {
            display: flex;
            justify-content: center;
            gap: 24px;
            border-bottom: 1px dashed #1f2937;
            padding-bottom: 8px;
            margin-bottom: 4px;
        }
        .station-btn {
            font-family: monospace;
            font-size: 0.85rem;
            color: #4b5563;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1.5px;
            transition: all 0.2s;
        }
        .station-btn.active {
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        /* Massive Primary Chrono Core Display */
        .time-display {
            display: flex;
            align-items: baseline;
            justify-content: center;
            font-weight: 200;
            letter-spacing: -3px;
        }
        #time-digits {
            font-size: calc(5.5rem + 2vw); /* High scale expansion priority */
            color: #ffffff;
            line-height: 0.95;
        }
        #sec-digits {
            font-size: 1.5rem;
            color: #00ff66;
            font-family: monospace;
            margin-left: 4px;
            letter-spacing: 0;
        }

        /* Restored Temperature Formatting Block */
        .metric-item.main-temp {
            border-bottom: 1px solid #1f2937;
            padding-bottom: 8px;
            margin-bottom: 2px;
        }
        .m-val.highlight {
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
            font-size: 1.6rem;
            font-weight: 500;
        }

        /* Highly Compacted Atmospheric Secondary Rows */
        .metrics-list {
            display: flex;
            flex-direction: column;
            gap: 6px; /* Tight grid convergence */
        }
        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0; /* Minimal vertical footprint padding */
            border-bottom: 1px solid #111622;
        }
        .m-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .m-val {
            font-size: 1.2rem;
            font-weight: 400;
        }
        .m-val.accent {
            color: #00ff66;
            font-family: monospace;
        }

        /* Hide-and-Seek Setup Footer Segment */
        .config-trigger {
            text-align: center;
            font-size: 0.72rem;
            color: #374151;
            cursor: pointer;
            padding: 6px;
            font-family: monospace;
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease-in-out;
            opacity: 1;
            margin-top: 4px;
        }
        .config-trigger.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Landscape Orientation Dynamic Layout Reflow Matrix */
        @media (orientation: landscape) {
            body {
                padding: 8px;
            }
            #workspace {
                max-width: 680px;
                display: grid;
                grid-template-columns: 1.1fr 1fr;
                column-gap: 32px;
                row-gap: 4px;
                align-items: center;
            }
            .station-selector {
                grid-column: span 2;
                padding-bottom: 6px;
                margin-bottom: 0;
            }
            .time-display {
                justify-content: center;
                margin-bottom: 0;
            }
            #time-digits {
                font-size: calc(6rem + 1vw);
            }
            .metrics-list {
                gap: 4px;
            }
            .config-trigger {
                grid-column: span 2;
                margin-top: 0;
                padding: 2px;
            }
        }
    </style>
</head>
<body onclick="toggleConfigDisplay()">

<div id="workspace">

    <div class="station-selector">
        <div id="btn-home" class="station-btn active" onclick="switchStation('home', event)">[ HOME ]</div>
        <div id="btn-local" class="station-btn" onclick="switchStation('local', event)">[ LOCAL ]</div>
    </div>
    
    <div class="time-display">
        <span id="time-digits">00:00</span><span id="sec-digits">00</span>
    </div>

    <div class="metrics-list">
        <div class="metric-item main-temp">
            <div class="m-label">Temperature</div>
            <div class="m-val highlight" id="data-temp">--°F</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Sky Condition</div>
            <div class="m-val" id="data-cond">Syncing...</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Humidity</div>
            <div class="m-val accent" id="data-humid">--%</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Barometer</div>
            <div class="m-val accent" id="data-baro">-- IN</div>
        </div>
    </div>

    <div class="config-trigger" id="config-footer" onclick="editHomeZip(event)">
        [ edit home base zip code ]
    </div>
</div>

<script>
    let currentMode = "home"; 
    let homeZip = localStorage.getItem('terminal_home_zip');
    let footerVisible = true;

    if (!homeZip) {
        homeZip = "94505";
        localStorage.setItem('terminal_home_zip', homeZip);
    }

    // Toggle the configuration link on/off when workspace is tapped
    function toggleConfigDisplay() {
        if (currentMode === "local") return; // Keep clean if running on auto GPS tracking anyway
        
        footerVisible = !footerVisible;
        const footer = document.getElementById("config-footer");
        if (footerVisible) {
            footer.classList.remove("hidden");
        } else {
            footer.classList.add("hidden");
        }
    }

    function tick() {
        const now = new Date();
        let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
        
        h = h % 12; h = h ? h : 12;
        m = m < 10 ? '0' + m : m; s = s < 10 ? '0' + s : s;

        document.getElementById("time-digits").innerText = `${h}:${m}`;
        document.getElementById("sec-digits").innerText = s;

        if (m === 0 && s === 0) {
            updateAtmosphereFeed();
        }
    }

    function switchStation(targetMode, event) {
        if (event) event.stopPropagation(); // Stop background trigger firing toggles
        if (currentMode === targetMode) return;
        currentMode = targetMode;

        document.getElementById("btn-home").classList.toggle("active", currentMode === "home");
        document.getElementById("btn-local").classList.toggle("active", currentMode === "local");
        
        const footer = document.getElementById("config-footer");
        if (currentMode === "local") {
            footer.classList.add("hidden");
        } else if (footerVisible) {
            footer.classList.remove("hidden");
        }
        
        updateAtmosphereFeed();
    }

    function editHomeZip(event) {
        if (event) event.stopPropagation(); // Protect visibility configuration loops
        const res = prompt("Enter 5-Digit HOME Base ZIP Code:", homeZip);
        if (res && res.length === 5 && !isNaN(res)) {
            homeZip = res;
            localStorage.setItem('terminal_home_zip', homeZip);
            if (currentMode === "home") updateAtmosphereFeed();
        }
    }

    function updateAtmosphereFeed() {
        if (currentMode === "home") {
            fetchHomeWeather();
        } else {
            fetchGpsLocalWeather();
        }
    }

    async function fetchHomeWeather() {
        try {
            document.getElementById("data-cond").innerText = "Syncing Home...";
            const geoRes = await fetch(`https://api.zippopotam.us/us/${homeZip}`);
            if (!geoRes.ok) throw new Error();
            const geoData = await geoRes.json();
            
            const lat = geoData.places[0].latitude;
            const lon = geoData.places[0].longitude;
            
            fetchRadarMetrics(lat, lon);
        } catch {
            document.getElementById("data-cond").innerText = "Home Address Error";
        }
    }

    function fetchGpsLocalWeather() {
        if (!navigator.geolocation) {
            document.getElementById("data-cond").innerText = "No GPS Capability";
            return;
        }

        document.getElementById("data-cond").innerText = "Searching Satellites...";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                fetchRadarMetrics(position.coords.latitude, position.coords.longitude);
            },
            () => {
                document.getElementById("data-cond").innerText = "GPS Tracking Banned";
            },
            { enableHighAccuracy: false, timeout: 6000, maximumAge: 120000 }
        );
    }

    async function fetchRadarMetrics(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,weather_code&temperature_unit=fahrenheit`;
            const response = await fetch(url);
            const data = await response.json();
            const current = data.current;

            const wmoCodes = {
                0: "Clear Sky ☀️", 1: "Mainly Clear 🌤️", 2: "Partly Cloudy ⛅", 3: "Overcast ☁️",
                45: "Foggy 🌫️", 51: "Light Drizzle 🌧️", 61: "Slight Rain 🌧️", 63: "Moderate Rain 🌧️",
                65: "Heavy Rain 🌧️", 71: "Slight Snow ❄️", 80: "Rain Showers 🌦️", 95: "Thunderstorm 🌩️"
            };

            const hpaToInches = (current.surface_pressure * 0.02953).toFixed(2);
            document.getElementById("data-temp").innerText = `${Math.round(current.temperature_2m)}°F`;
            document.getElementById("data-cond").innerText = wmoCodes[current.weather_code] || "Clear Sky ☀️";
            document.getElementById("data-humid").innerText = `${current.relative_humidity_2m}%`;
            document.getElementById("data-baro").innerText = `${hpaToInches} IN`;

        } catch (err) {
            document.getElementById("data-cond").innerText = "Server Timeout";
        }
    }

    setInterval(tick, 1000);
    tick();
    updateAtmosphereFeed();
</script>

</body>
</html>
