<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Desk Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #060709;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.4s ease;
        }
        
        #workspace {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.3s ease;
        }

        /* Interface Toggle Animation Classes */
        .zen-active .hide-on-zen {
            opacity: 0 !important;
            pointer-events: none !important;
        }
        
        .hide-on-zen {
            transition: opacity 0.25s ease-in-out;
        }

        /* Nav Header Line */
        .status-row {
            display: flex;
            justify-content: flex-end;
            font-size: 0.75rem;
            color: #4b5563;
            font-family: monospace;
            letter-spacing: 1px;
        }

        /* Dual Station Segment Controller */
        .station-selector {
            display: flex;
            justify-content: center;
            gap: 24px;
            border-bottom: 1px dashed #1f2937;
            padding-bottom: 12px;
        }
        .station-btn {
            font-family: monospace;
            font-size: 0.85rem;
            color: #4b5563;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1.5px;
            transition: all 0.2s;
        }
        .station-btn.active {
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        /* Giant Chrono Center */
        .time-display {
            display: flex;
            align-items: baseline;
            justify-content: center;
            font-weight: 200;
            letter-spacing: -2px;
        }
        #time-digits {
            font-size: 5.5rem;
            color: #ffffff;
            line-height: 1;
        }
        #sec-digits {
            font-size: 1.6rem;
            color: #00ff66;
            font-family: monospace;
            margin-left: 6px;
        }

        /* Massive Primary Temp Display Block */
        .primary-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -10px;
            margin-bottom: 5px;
        }
        #data-temp {
            font-size: 4rem;
            font-weight: 300;
            color: #ff00ff;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
            line-height: 1;
        }

        /* Tightened Atmosphere Metric Rows */
        .metrics-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #111622;
        }
        .m-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .m-val {
            font-size: 1.2rem;
            font-weight: 500;
        }
        .m-val.accent {
            color: #00ff66;
            font-family: monospace;
        }

        /* Console Footer Configuration Track */
        .config-trigger {
            text-align: center;
            font-size: 0.72rem;
            color: #4b5563;
            cursor: pointer;
            padding: 4px;
            font-family: monospace;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        .config-trigger:hover {
            color: #9ca3af;
        }

        /* Landscape Orientation Rules Override Matrix */
        @media (orientation: landscape) {
            body {
                padding: 15px;
            }
            #workspace {
                max-width: 720px;
                display: grid;
                grid-template-columns: 1.2fr 1fr;
                column-gap: 40px;
                row-gap: 10px;
                align-items: center;
            }
            .status-row {
                grid-column: span 2;
            }
            .station-selector {
                grid-column: span 2;
                padding-bottom: 8px;
                margin-bottom: -10px;
            }
            .main-chrono-group {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            #time-digits {
                font-size: 6rem;
            }
            #data-temp {
                font-size: 4.5rem;
            }
            .metrics-list {
                gap: 8px;
            }
            .config-trigger {
                grid-column: span 2;
            }
        }
    </style>
</head>
<body onclick="toggleZenMode(event)">

<div id="workspace">
    <div class="status-row hide-on-zen">
        <div id="active-station-tag">STATION // HOME</div>
    </div>

    <div class="station-selector hide-on-zen">
        <div id="btn-home" class="station-btn active" onclick="switchStation('home', event)">[ HOME ]</div>
        <div id="btn-local" class="station-btn" onclick="switchStation('local', event)">[ LOCAL ]</div>
    </div>
    
    <div class="main-chrono-group">
        <div class="time-display">
            <span id="time-digits">00:00</span><span id="sec-digits">00</span>
        </div>
        <div class="primary-temp-container">
            <div id="data-temp">--°F</div>
        </div>
    </div>

    <div class="metrics-list">
        <div class="metric-item">
            <div class="m-label">Sky Condition</div>
            <div class="m-val" id="data-cond">Syncing...</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Humidity</div>
            <div class="m-val accent" id="data-humid">--%</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Barometer</div>
            <div class="m-val accent" id="data-baro">-- IN</div>
        </div>
    </div>

    <div class="config-trigger hide-on-zen" id="config-footer" onclick="editHomeZip(event)">
        [ edit home base zip code ]
    </div>
</div>

<script>
    let currentMode = "home"; 
    let homeZip = localStorage.getItem('terminal_home_zip');
    let isZenMode = false;

    if (!homeZip) {
        homeZip = "94505";
        localStorage.setItem('terminal_home_zip', homeZip);
    }

    // Zen Mode Workspace Masking Trigger
    function toggleZenMode(event) {
        // Prevent activation if clicking intentional configuration triggers
        if (event.target.closest('.station-btn') || event.target.closest('#config-footer')) {
            return;
        }
        
        isZenMode = !isZenMode;
        if (isZenMode) {
            document.body.classList.add("zen-active");
            document.body.style.backgroundColor = "#000000"; // Deep true-black drop for OLED power savings
        } else {
            document.body.classList.remove("zen-active");
            document.body.style.backgroundColor = "#060709";
        }
    }

    function tick() {
        const now = new Date();
        let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
        
        h = h % 12; h = h ? h : 12;
        m = m < 10 ? '0' + m : m; s = s < 10 ? '0' + s : s;

        document.getElementById("time-digits").innerText = `${h}:${m}`;
        document.getElementById("sec-digits").innerText = s;

        if (m === 0 && s === 0) {
            updateAtmosphereFeed();
        }
    }

    function switchStation(targetMode, event) {
        if (event) event.stopPropagation(); // Stop background trigger firing zen mode
        if (currentMode === targetMode) return;
        currentMode = targetMode;

        document.getElementById("btn-home").classList.toggle("active", currentMode === "home");
        document.getElementById("btn-local").classList.toggle("active", currentMode === "local");
        
        document.getElementById("active-station-tag").innerText = `STATION // ${currentMode.toUpperCase()}`;
        
        if (currentMode === "local") {
            document.getElementById("config-footer").style.visibility = "hidden";
        } else {
            document.getElementById("config-footer").style.visibility = "visible";
            document.getElementById("config-footer").innerText = `[ edit home base zip code ]`;
        }

        updateAtmosphereFeed();
    }

    function editHomeZip(event) {
        if (event) event.stopPropagation();
        const res = prompt("Enter 5-Digit HOME Base ZIP Code:", homeZip);
        if (res && res.length === 5 && !isNaN(res)) {
            homeZip = res;
            localStorage.setItem('terminal_home_zip', homeZip);
            if (currentMode === "home") updateAtmosphereFeed();
        }
    }

    function updateAtmosphereFeed() {
        if (currentMode === "home") {
            fetchHomeWeather();
        } else {
            fetchGpsLocalWeather();
        }
    }

    async function fetchHomeWeather() {
        try {
            document.getElementById("data-cond").innerText = "Syncing Home...";
            const geoRes = await fetch(`https://api.zippopotam.us/us/${homeZip}`);
            if (!geoRes.ok) throw new Error();
            const geoData = await geoRes.json();
            
            const lat = geoData.places[0].latitude;
            const lon = geoData.places[0].longitude;
            
            fetchRadarMetrics(lat, lon);
        } catch {
            document.getElementById("data-cond").innerText = "Home Address Error";
        }
    }

    function fetchGpsLocalWeather() {
        if (!navigator.geolocation) {
            document.getElementById("data-cond").innerText = "No GPS Capability";
            return;
        }

        document.getElementById("data-cond").innerText = "Searching Satellites...";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                fetchRadarMetrics(position.coords.latitude, position.coords.longitude);
            },
            () => {
                document.getElementById("data-cond").innerText = "GPS Tracking Banned";
            },
            { enableHighAccuracy: false, timeout: 6000, maximumAge: 120000 }
        );
    }

    async function fetchRadarMetrics(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,weather_code&temperature_unit=fahrenheit`;
            const response = await fetch(url);
            const data = await response.json();
            const current = data.current;

            const wmoCodes = {
                0: "Clear Sky ☀️", 1: "Mainly Clear 🌤️", 2: "Partly Cloudy ⛅", 3: "Overcast ☁️",
                45: "Foggy 🌫️", 51: "Light Drizzle 🌧️", 61: "Slight Rain 🌧️", 63: "Moderate Rain 🌧️",
                65: "Heavy Rain 🌧️", 71: "Slight Snow ❄️", 80: "Rain Showers 🌦️", 95: "Thunderstorm 🌩️"
            };

            const hpaToInches = (current.surface_pressure * 0.02953).toFixed(2);
            document.getElementById("data-temp").innerText = `${Math.round(current.temperature_2m)}°F`;
            document.getElementById("data-cond").innerText = wmoCodes[current.weather_code] || "Clear Sky ☀️";
            document.getElementById("data-humid").innerText = `${current.relative_humidity_2m}%`;
            document.getElementById("data-baro").innerText = `${hpaToInches} IN`;

        } catch (err) {
            document.getElementById("data-cond").innerText = "Server Timeout";
        }
    }

    setInterval(tick, 1000);
    tick();
    updateAtmosphereFeed();
</script>

</body>
</html>
