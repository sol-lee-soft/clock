<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Desk Terminal</title>
  
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="dark only">
  <meta name="background-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    html, body {
      background-color: #000000 !important;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100%;
      height: 100dvh; 
      width: 100vw;
      overflow: hidden; 
      position: relative; 
      cursor: pointer; 
      -webkit-tap-highlight-color: transparent; 
    }

    /* Core Stack: Forces Clock over Weather in all orientations */
    .terminal-container {
      height: 100%;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* Massive Primary Clock Engine Readout */
    .time-display {
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-weight: 200;
      letter-spacing: -4px;
      pointer-events: none;
    }
    #time-digits {
      font-size: 32vmin; /* Scaled cleanly using fluid vmin metrics */
      color: #ffffff;
      line-height: 0.85;
    }
    #sec-digits {
      font-size: 7vmin;
      color: #00ff66;
      font-family: monospace;
      margin-left: 6px;
    }

    /* Tight Uniform Atmospheric Grid Rows */
    .metrics-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin-top: 24px;
      pointer-events: none;
    }
    .metric-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #111622;
    }
    .m-label {
      font-size: 13px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .m-val {
      font-size: 22px;
      font-weight: bold;
    }
    .m-val.highlight {
      color: #ff00ff;
      text-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
    }
    .m-val.accent {
      color: #00ff66;
      font-family: monospace;
    }

    /* Consolidated Single-Line Control Strip */
    .control-footer {
      position: absolute;
      bottom: 4dvh;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #4b5563;
      font-family: monospace;
      letter-spacing: 0.5px;
      transition: opacity 0.2s ease-in-out, visibility 0.2s;
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }
    .control-footer.hidden {
      opacity: 0 !important;
      visibility: hidden !important;
    }
    .action-link {
      color: #00ff66;
      cursor: pointer;
      margin-left: 8px;
      font-weight: bold;
      display: inline-block;
    }
    .action-link.edit-btn {
      color: #9ca3af;
      margin-left: 12px;
    }
  </style>
</head>
<body onclick="appActivationInitializer(event)">

  <div class="terminal-container">
    <div class="time-display">
        <span id="time-digits">--:--</span><span id="sec-digits">00</span>
    </div>

    <div class="metrics-list">
        <div class="metric-item">
            <div class="m-label">Temperature</div>
            <div class="m-val highlight" id="data-temp">--°F</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Sky Condition</div>
            <div class="m-val" id="data-cond">Syncing...</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Humidity</div>
            <div class="m-val accent" id="data-humid">--%</div>
        </div>
        <div class="metric-item">
            <div class="m-label">Barometer</div>
            <div class="m-val accent" id="data-baro">-- IN</div>
        </div>
    </div>
  </div>

  <div class="control-footer" id="control-bar">
      <span id="status-string">STATION: HOME</span>
      <span id="toggle-action" class="action-link" onclick="toggleTrackingMode(event)">[SWITCH TO LOCAL]</span>
      <span id="edit-action" class="action-link edit-btn" onclick="editHomeZip(event)">[EDIT ZIP]</span>
  </div>

  <script>
    let currentMode = localStorage.getItem('terminal_mode') || "home"; 
    let homeZip = localStorage.getItem('terminal_home_zip') || "94505";
    let isZenActive = false;

    localStorage.setItem('terminal_home_zip', homeZip);

    // Speedometer Activation: Clears browser headers AND toggles bottom menu mask
    function appActivationInitializer(event) {
      // If clicking an explicit configuration option button, let it process without hiding menus
      if (event.target.closest('.action-link')) {
        return;
      }

      // 1. Native Speedometer Fullscreen Engine Trigger
      toggleFullScreen();

      // 2. Clear Workspace Toggle logic
      isZenActive = !isZenActive;
      const footer = document.getElementById("control-bar");
      if (isZenActive) {
          footer.classList.add("hidden");
      } else {
          footer.classList.remove("hidden");
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn(`Error fullscreen: ${err.message}`);
        });
      }
    }

    function tick() {
        const now = new Date();
        let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
        
        h = h % 12; h = h ? h : 12;
        m = m < 10 ? '0' + m : m; s = s < 10 ? '0' + s : s;

        document.getElementById("time-digits").innerText = `${h}:${m}`;
        document.getElementById("sec-digits").innerText = s;

        if (m === 0 && s === 0) {
            updateAtmosphereFeed();
        }
    }

    function toggleTrackingMode(event) {
        if (event) event.stopPropagation(); 
        currentMode = (currentMode === "home") ? "local" : "home";
        localStorage.setItem('terminal_mode', currentMode);
        
        renderControlBar();
        updateAtmosphereFeed();
    }

    function renderControlBar() {
        const statusStr = document.getElementById("status-string");
        const toggleBtn = document.getElementById("toggle-action");
        const editBtn = document.getElementById("edit-action");

        if (currentMode === "home") {
            statusStr.innerText = "STATION: HOME";
            toggleBtn.innerText = "[SWITCH TO LOCAL]";
            editBtn.style.display = "inline-block";
        } else {
            statusStr.innerText = "STATION: LOCAL";
            toggleBtn.innerText = "[SWITCH TO HOME]";
            editBtn.style.display = "none";
        }
    }

    function editHomeZip(event) {
        if (event) event.stopPropagation();
        const res = prompt("Enter 5-Digit HOME Base ZIP Code:", homeZip);
        if (res && res.length === 5 && !isNaN(res)) {
            homeZip = res;
            localStorage.setItem('terminal_home_zip', homeZip);
            if (currentMode === "home") updateAtmosphereFeed();
        }
    }

    function updateAtmosphereFeed() {
        if (currentMode === "home") {
            fetchHomeWeather();
        } else {
            fetchGpsLocalWeather();
        }
    }

    async function fetchHomeWeather() {
        try {
            document.getElementById("data-cond").innerText = "Syncing...";
            const geoRes = await fetch(`https://api.zippopotam.us/us/${homeZip}`);
            if (!geoRes.ok) throw new Error();
            const geoData = await geoRes.json();
            fetchRadarMetrics(geoData.places[0].latitude, geoData.places[0].longitude);
        } catch {
            document.getElementById("data-cond").innerText = "Location Error";
        }
    }

    function fetchGpsLocalWeather() {
        if (!navigator.geolocation) {
            document.getElementById("data-cond").innerText = "No GPS Capability";
            return;
        }
        document.getElementById("data-cond").innerText = "Searching Satellites...";
        navigator.geolocation.getCurrentPosition(
            (position) => { fetchRadarMetrics(position.coords.latitude, position.coords.longitude); },
            () => { document.getElementById("data-cond").innerText = "GPS Access Denied"; },
            { enableHighAccuracy: false, timeout: 6000, maximumAge: 120000 }
        );
    }

    async function fetchRadarMetrics(lat, lon) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,weather_code&temperature_unit=fahrenheit`;
            const response = await fetch(url);
            const data = await response.json();
            const current = data.current;

            const wmoCodes = {
                0: "Clear Sky ☀️", 1: "Mainly Clear 🌤️", 2: "Partly Cloudy ⛅", 3: "Overcast ☁️",
                45: "Foggy 🌫️", 51: "Light Drizzle 🌧️", 61: "Slight Rain 🌧️", 63: "Moderate Rain 🌧️",
                65: "Heavy Rain 🌧️", 71: "Slight Snow ❄️", 80: "Rain Showers 🌦️", 95: "Thunderstorm 🌩️"
            };

            const hpaToInches = (current.surface_pressure * 0.02953).toFixed(2);
            document.getElementById("data-temp").innerText = `${Math.round(current.temperature_2m)}°F`;
            document.getElementById("data-cond").innerText = wmoCodes[current.weather_code] || "Clear Sky ☀️";
            document.getElementById("data-humid").innerText = `${current.relative_humidity_2m}%`;
            document.getElementById("data-baro").innerText = `${hpaToInches} IN`;
        } catch {
            document.getElementById("data-cond").innerText = "API Feed Timeout";
        }
    }

    setInterval(tick, 1000);
    tick();
    renderControlBar();
    updateAtmosphereFeed();
  </script>

</body>
</html>
